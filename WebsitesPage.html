<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View My Work - Dilian Jaars</title>
    <link rel="icon" href="IMAGES/dj logo.jpg" type="IMAGES/jpg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00ff88;
            --secondary-color: #00d4ff;
            --accent-color: #ff0080;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark-bg);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* Background */
        .bg-gradient {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
        }

        .bg-gradient::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary-color) 0%, transparent 70%);
            border-radius: 50%;
            top: 10%;
            right: 10%;
            opacity: 0.1;
            animation: float 15s ease-in-out infinite;
        }

        .bg-gradient::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            border-radius: 50%;
            bottom: 10%;
            left: 10%;
            opacity: 0.1;
            animation: float 12s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        /* Header */
        .header {
            padding: 80px 0 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.3rem;
            color: #aaa;
            margin-bottom: 2rem;
        }

        .divider {
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            margin: 2rem auto;
            box-shadow: 0 0 15px var(--primary-color);
        }

        /* Work Grid */
        .work-container {
            padding: 60px 0 100px;
        }

        .work-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .work-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .work-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
            box-shadow: 0 15px 40px rgba(0, 255, 136, 0.3);
        }

        .work-image {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .work-image i {
            font-size: 5rem;
            color: rgba(0, 0, 0, 0.5);
            z-index: 2;
            position: relative;
        }

        .work-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 3;
        }

        .work-card:hover .work-overlay {
            opacity: 1;
        }

        .overlay-btn {
            width: 50px;
            height: 50px;
            border: 2px solid var(--primary-color);
            background: transparent;
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .overlay-btn:hover {
            background: var(--primary-color);
            color: var(--dark-bg);
            transform: scale(1.1);
        }

        .work-content {
            padding: 25px;
        }

        .work-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-light);
        }

        .work-description {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .work-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .work-tag {
            background: rgba(0, 255, 136, 0.15);
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        
        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 999;
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: var(--dark-bg);
            transform: scale(1.1);
        }

       
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .work-grid {
                grid-template-columns: 1fr;
            }

            .back-btn {
                top: 20px;
                left: 20px;
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    
    <a href="view my work.html" class="back-btn" title="Go Back">
        <i class="fas fa-arrow-left"></i>
    </a>

   
    <div class="header">
        <div class="container">
            <h1>Websites</h1>
            <div class="divider"></div>
            <p>Everyday Websites</p>
        </div>
    </div>

    
    <div class="work-container">
        <div class="container">
            <div class="work-grid" id="workGrid">
               
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
        
        

        
        function loadWorks() {
            const grid = document.getElementById('workGrid');
            
            works.forEach(work => {
                const workCard = document.createElement('div');
                workCard.className = 'work-card';
                workCard.innerHTML = `
                    <div class="work-image" style="background: ${work.gradient};">
                        <i class="fas ${work.icon}"></i>
                        <div class="work-overlay">
                            ${work.liveLink ? `<a href="${work.liveLink}" target="_blank" class="overlay-btn" title="View Live"><i class="fas fa-external-link-alt"></i></a>` : ''}
                            ${work.codeLink ? `<a href="${work.codeLink}" target="_blank" class="overlay-btn" title="View Code"><i class="fab fa-github"></i></a>` : ''}
                        </div>
                    </div>
                    <div class="work-content">
                        <h3 class="work-title">${work.title}</h3>
                        <p class="work-description">${work.description}</p>
                        <div class="work-tags">
                            ${work.tags.map(tag => `<span class="work-tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(workCard);
            });
        }

        
        loadWorks();
    </script>
</body>
</html>
